name: Deploy to GitHub Pages

# Build and deploy are separate jobs so "Re-run failed jobs" retries only the
# deployment instead of uploading a second github-pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BASE: /orca-console/

      - name: Remove stale Pages artifacts
        if: github.run_attempt > 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          artifact_ids=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')

          if [ -z "$artifact_ids" ]; then
            echo "No stale github-pages artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            echo "Deleting stale github-pages artifact $artifact_id."
            gh api -X DELETE \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail

          for attempt in {1..30}; do
            if count=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null); then
              if ! [[ "$count" =~ ^[0-9]+$ ]]; then
                echo "Attempt $attempt/30: unexpected artifact count; retrying in 3s."
              elif [ "$count" -eq 1 ]; then
                echo "github-pages artifact is available."
                exit 0
              elif [ "$count" -gt 1 ]; then
                echo "::error::Found $count github-pages artifacts for this run. Re-run only the failed deploy job, or delete the stale artifacts, before retrying."
                exit 1
              else
                echo "Attempt $attempt/30: github-pages artifact not visible yet; waiting 3s."
              fi
            else
              echo "Attempt $attempt/30: artifact lookup failed; retrying in 3s."
            fi

            sleep 3
          done

          echo "::error::github-pages artifact did not become available for run $GITHUB_RUN_ID."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
