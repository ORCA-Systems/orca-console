name: Deploy to GitHub Pages

# Build and deploy are separate jobs so "Re-run failed jobs" retries only the
# deployment instead of uploading a second github-pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_BASE: /orca-console/

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            count=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')

            if [ "$count" -eq 1 ]; then
              echo "github-pages artifact is available."
              exit 0
            fi

            if [ "$count" -gt 1 ]; then
              echo "::error::Found $count github-pages artifacts for this run. Re-run only the failed deploy job, or delete the stale artifacts, before retrying."
              exit 1
            fi

            echo "Attempt $attempt/20: no github-pages artifact yet; waiting 3s."
            sleep 3
          done

          echo "::error::github-pages artifact did not become available for run $GITHUB_RUN_ID."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
